# AI Gallery Nginx site template.
#
# Copy this file to /etc/nginx/sites-enabled/ai-gallery.conf, then replace
# example.com and certificate paths with your production values.
#
# Image generation can take several minutes, especially when using streaming
# upstream responses or large reference images. Keep the proxy timeouts high;
# do not use short defaults such as 60s for /api/ or /uploads/.

upstream ai_gallery_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ai_gallery_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/nginx/cert/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/example.com/privkey.pem;

    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long timeouts are required for image generation and streaming responses.
    # Keep these aligned with OPENAI_UPSTREAM_TIMEOUT_MS and REQUEST_BODY_LIMIT.
    proxy_connect_timeout 120s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location /api/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_pass http://ai_gallery_api/;
    }

    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://ai_gallery_api;
    }

    location / {
        proxy_pass http://ai_gallery_web;
    }
}
